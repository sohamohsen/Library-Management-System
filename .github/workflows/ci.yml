name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # نعرّف env من الـ secrets مرة واحدة
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests)
        run: mvn -B -ntp clean verify -DskipTests
      - name: Log in to Docker hub
        uses: docker/login-action@3
        with: 
          registry: docker.io
          username: ${{ env.DOCKER.USERNAME }}
          password: ${{ env.DOCKER.PASSWORD }}
      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER.USERNAME }}/library-management:latest
      - name: Push Docker image
        run: doker push ${{ env.DOCKER.USERNAME }}/library-management:latest
